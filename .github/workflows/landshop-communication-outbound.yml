name: Landshop Outbound Communications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview or send with all safeguards'
        type: choice
        options:
          - preview
          - send
        default: preview
  push:
    branches: [main]
    paths:
      - 'scripts/landshop-communication-dispatch.mjs'
      - 'scripts/landshop-communications-readiness.mjs'
      - '.github/workflows/landshop-communication-outbound.yml'
permissions:
  contents: read
concurrency:
  group: landshop-communication-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.LANDSHOP_COMM_LIVE_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: landshop-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Audit current production credentials and consent gates without sending
        env:
          LANDSHOP_COMM_LIVE_ENABLED: ${{ vars.LANDSHOP_COMM_LIVE_ENABLED || 'false' }}
          LANDSHOP_COMM_ROTATION_CONFIRMED: ${{ vars.LANDSHOP_COMM_ROTATION_CONFIRMED || 'false' }}
          LANDSHOP_COMM_EMAIL_LIVE: ${{ vars.LANDSHOP_COMM_EMAIL_LIVE || 'false' }}
          LANDSHOP_COMM_WHATSAPP_LIVE: ${{ vars.LANDSHOP_COMM_WHATSAPP_LIVE || 'false' }}
          LANDSHOP_COMM_SMS_LIVE: ${{ vars.LANDSHOP_COMM_SMS_LIVE || 'false' }}
          LANDSHOP_SUPABASE_URL: ${{ vars.LANDSHOP_SUPABASE_URL || 'https://iwkfagzkogzidrbbezds.supabase.co' }}
          LANDSHOP_SUPABASE_SECRET_KEY: ${{ secrets.LANDSHOP_SUPABASE_SECRET_KEY }}
          LANDSHOP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LANDSHOP_SUPABASE_SERVICE_ROLE_KEY }}
          LANDSHOP_POSTMARK_TRANSACTIONAL_TOKEN: ${{ secrets.LANDSHOP_POSTMARK_TRANSACTIONAL_TOKEN || secrets.LANDSHOP_POSTMARK_BROADCAST_TOKEN }}
          LANDSHOP_POSTMARK_TRANSACTIONAL_FROM: ${{ vars.LANDSHOP_POSTMARK_TRANSACTIONAL_FROM || vars.LANDSHOP_NEWSLETTER_FROM }}
          LANDSHOP_POSTMARK_WEBHOOK_USERNAME: ${{ secrets.LANDSHOP_POSTMARK_WEBHOOK_USERNAME }}
          LANDSHOP_POSTMARK_WEBHOOK_PASSWORD: ${{ secrets.LANDSHOP_POSTMARK_WEBHOOK_PASSWORD }}
          LANDSHOP_WHATSAPP_ACCESS_TOKEN: ${{ secrets.LANDSHOP_WHATSAPP_ACCESS_TOKEN }}
          LANDSHOP_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.LANDSHOP_WHATSAPP_PHONE_NUMBER_ID }}
          LANDSHOP_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.LANDSHOP_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          LANDSHOP_WHATSAPP_APP_SECRET: ${{ secrets.LANDSHOP_WHATSAPP_APP_SECRET }}
          LANDSHOP_TERMII_API_KEY: ${{ secrets.LANDSHOP_TERMII_API_KEY }}
          LANDSHOP_TERMII_SENDER_ID: ${{ vars.LANDSHOP_TERMII_SENDER_ID }}
        run: node scripts/landshop-communications-readiness.mjs
      - name: Validate dispatch logic without sending
        run: node scripts/landshop-communication-dispatch.mjs --self-test
      - name: Run scheduled outbound dispatcher with strict authorization
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'send')
        env:
          LANDSHOP_COMM_LIVE_ENABLED: ${{ vars.LANDSHOP_COMM_LIVE_ENABLED || 'false' }}
          LANDSHOP_COMM_ROTATION_CONFIRMED: ${{ vars.LANDSHOP_COMM_ROTATION_CONFIRMED || 'false' }}
          LANDSHOP_COMM_EMAIL_LIVE: ${{ vars.LANDSHOP_COMM_EMAIL_LIVE || 'false' }}
          LANDSHOP_COMM_WHATSAPP_LIVE: ${{ vars.LANDSHOP_COMM_WHATSAPP_LIVE || 'false' }}
          LANDSHOP_COMM_SMS_LIVE: ${{ vars.LANDSHOP_COMM_SMS_LIVE || 'false' }}
          LANDSHOP_COMM_BATCH_SIZE: ${{ vars.LANDSHOP_COMM_BATCH_SIZE || '5' }}
          LANDSHOP_SUPABASE_URL: ${{ vars.LANDSHOP_SUPABASE_URL || 'https://iwkfagzkogzidrbbezds.supabase.co' }}
          LANDSHOP_SUPABASE_SECRET_KEY: ${{ secrets.LANDSHOP_SUPABASE_SECRET_KEY }}
          LANDSHOP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LANDSHOP_SUPABASE_SERVICE_ROLE_KEY }}
          LANDSHOP_POSTMARK_TRANSACTIONAL_TOKEN: ${{ secrets.LANDSHOP_POSTMARK_TRANSACTIONAL_TOKEN || secrets.LANDSHOP_POSTMARK_BROADCAST_TOKEN }}
          LANDSHOP_POSTMARK_TRANSACTIONAL_FROM: ${{ vars.LANDSHOP_POSTMARK_TRANSACTIONAL_FROM || vars.LANDSHOP_NEWSLETTER_FROM }}
          LANDSHOP_WHATSAPP_ACCESS_TOKEN: ${{ secrets.LANDSHOP_WHATSAPP_ACCESS_TOKEN }}
          LANDSHOP_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.LANDSHOP_WHATSAPP_PHONE_NUMBER_ID }}
          LANDSHOP_TERMII_API_KEY: ${{ secrets.LANDSHOP_TERMII_API_KEY }}
          LANDSHOP_TERMII_SENDER_ID: ${{ vars.LANDSHOP_TERMII_SENDER_ID }}
        run: node scripts/landshop-communication-dispatch.mjs --send
