name: Import owner-approved Landshop About hero photos
on:
  push:
    paths:
      - .github/workflows/import-landshop-about-images.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: landshop-about-hero-owner-media
  cancel-in-progress: false
jobs:
  import-owner-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codec
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download and optimize the three exact owner-supplied images
        env:
          BUILDING_URL: https://at.adobe.com/VTlmoAAW3NrnrJTr
          PEOPLE_URL: https://at.adobe.com/UnnMJFQhl6gST1gY
          GATE_URL: https://at.adobe.com/Wskzp8GP0hcXkeoy
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image,ImageOps
          import os
          dest=Path('apps/website/public/about')
          dest.mkdir(parents=True,exist_ok=True)
          files=[
            ('BUILDING_URL','landshop-landmark-building.webp'),
            ('PEOPLE_URL','landshop-site-team-huddle.webp'),
            ('GATE_URL','landshop-white-estate-gate.webp')
          ]
          for key,name in files:
            request=Request(os.environ[key],headers={'User-Agent':'Mozilla/5.0 (compatible; LandshopOwnerMediaImporter/1.0)'})
            with urlopen(request,timeout=55) as source:
              raw=source.read(16*1024*1024)
            with Image.open(BytesIO(raw)) as original:
              image=ImageOps.exif_transpose(original).convert('RGB')
              image.thumbnail((1700,1700),Image.Resampling.LANCZOS)
              assert image.width >= 850 and image.height >= 650, f'Unexpected source dimensions for {name}: {image.size}'
              output=dest/name
              image.save(output,format='WEBP',quality=85,method=6)
              assert output.stat().st_size >= 25000, f'Unexpectedly small source asset: {name}'
              print(f'IMPORTED {output} {image.width}x{image.height} {output.stat().st_size} bytes')
          PY
      - name: Commit checked owner imagery and remove one-time importer
        run: |
          set -euo pipefail
          git config user.name "landshop-release-bot"
          git config user.email "landshop-release-bot@users.noreply.github.com"
          git add apps/website/public/about
          git rm .github/workflows/import-landshop-about-images.yml
          git commit -m "assets(about): import three owner-supplied hero photographs"
          git pull --rebase origin main
          git push origin HEAD:main
