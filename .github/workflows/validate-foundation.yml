name: Validate Landshop Foundation
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'scripts/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-foundation.yml'
      - '.github/workflows/landshop-communication-outbound.yml'
      - '.github/workflows/deploy-landshop-enterprise.yml'
      - '.github/workflows/website-release-validation.yml'
      - '.github/workflows/landshop-live-health.yml'
      - '.github/workflows/landshop-production-e2e.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: landshop-validation-${{ github.ref }}
  # Keep mainline release validation alive; PR runs may still supersede each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Command Center navigation, content safety and export integrity
        run: node scripts/verify-command-center.mjs
      - name: Validate premium automation studio syntax, responsive controls and preserved runtime
        run: node scripts/verify-landshop-automation-ux.mjs
      - name: Block high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Compile production release checks without network requests
        run: python3 -m py_compile scripts/check-landshop-live-owner-photos.py scripts/check-landshop-live-assets.py scripts/check-landshop-public-pages.py
      - name: Verify real Nigerian editorial photo licenses and CDN availability
        run: python3 scripts/validate-genuine-photos.py
      - name: Prepare faithful transparent Landshop PNG logo
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/prepare-transparent-logo.py
          test -s apps/website/public/media/logo-transparent.png
      - name: Verify transparent Landshop logo assets and homepage navigation across all apps
        run: python3 scripts/verify-landshop-logo-governance.py
      - name: Verify owner-provided real photography and all editorial mappings
        run: python3 scripts/verify-landshop-owner-media.py
      - name: Verify public text contains no long dash punctuation
        run: python3 scripts/verify-landshop-public-punctuation.py
      - name: Verify staff brand wording is removed across Landshop applications
        run: python3 scripts/verify-landshop-staff-branding.py
      - name: Enforce one approved 27px arrow and icon standard
        run: python3 scripts/verify-landshop-arrow-standard.py
      - name: Verify private project photography governance
        run: python3 scripts/verify-project-photo-governance.py
      - name: Verify Supabase index migration and 12-character signup guardrails
        run: python3 scripts/verify-landshop-supabase-security-baseline.py
      - name: Verify account destination separation
        run: node --experimental-strip-types --test packages/shared/account-home.test.mjs
      - name: Enforce explicit grants for newly introduced privileged Supabase functions
        run: python3 scripts/verify-landshop-privileged-rpc-migrations.py
      - name: Verify no-cost compromised-password screening in customer and staff auth
        run: python3 scripts/verify-landshop-free-password-protection.py
      - name: Verify public auth email flood protection and safe recovery routing
        run: python3 scripts/verify-landshop-auth-email-security.py
      - name: Validate provider webhook shape handling and independent process quotas
        run: python3 scripts/verify-landshop-webhook-and-throttle-hardening.py
      - name: Verify communication dispatcher without customer sends
        run: |
          node scripts/landshop-communication-dispatch.mjs --self-test
          node scripts/landshop-communication-dispatch.mjs --preview
      - name: Build applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://iwkfagzkogzidrbbezds.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
          NEXT_PUBLIC_PORTAL_URL: https://portal.landshopnigeria.com
          NEXT_PUBLIC_APP_URL: https://app.landshopnigeria.com
          NEXT_PUBLIC_LANDSHOP_RELEASE_SHA: ${{ github.sha }}
        run: |
          npm run build -w @landshop/website
          npm run build -w @landshop/portal
          npm run build -w @landshop/dashboard
      - name: Verify standalone cPanel release bundles and Node startup
        env:
          LANDSHOP_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/package-landshop-standalone.sh
          for app in website portal dashboard; do
            PORT=39519 HOSTNAME=127.0.0.1 node "release/$app/server.js" >"/tmp/landshop-$app.log" 2>&1 &
            pid=$!
            ready=false
            for attempt in $(seq 1 35); do
              if curl -fsS --max-time 2 "http://127.0.0.1:39519/api/release-health" > "/tmp/landshop-$app.json"; then
                ready=true
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              cat "/tmp/landshop-$app.log"
              exit 1
            fi
            SERVICE="landshop-$app" python3 - <<'PY'
          import json,os
          with open('/tmp/landshop-'+os.environ['SERVICE'].split('-')[1]+'.json') as file:
              result=json.load(file)
          assert result['service']==os.environ['SERVICE']
          assert result['status']=='serving-nextjs'
          assert result['commit']==os.environ['LANDSHOP_RELEASE_SHA']
          PY
            # Verify source-aligned product/application pages render, not just the health route.
            if [ "$app" = "website" ]; then
              routes=(/ /develop /incubate /grow /applications /properties /search /about /contact /insights
                /projects/blue-diamonds /properties/blue-diamonds
                /company/team /thrift /services/property-acquisition /services/advisory
                /services/mortgage /services/construction-credit /grow/beta-mortgage /grow/mortgage-xtra)
            elif [ "$app" = "portal" ]; then
              routes=(/ /applications /applications/develop-house /applications/develop-land \
                /applications/incubate-investment /applications/beta-mortgage \
                /applications/mortgage-xtra /applications/develop-inspection \
                /applications/mortgage-xtra-inspection /calculator)
            else
              routes=(/ /dashboard /dashboard/account /dashboard/kyc \
                /staff/sign-in /staff/sign-up /staff/terms /staff/privacy)
            fi
            for route in "${routes[@]}";do
              code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
                "http://127.0.0.1:39519$route")
              if [ "$app" = "dashboard" ];then
                # Public guests must not receive private dashboard contents.
                case "$code" in 307|308) echo "Protected dashboard redirects unauthenticated visitor: $route";continue;; esac
              fi
              if [ "$code" != 200 ];then
                echo "::error::Landshop $app $route returned HTTP $code in standalone runtime"
                cat "/tmp/landshop-$app.log"
                kill "$pid" || true
                exit 1
              fi
              echo "SSR/route smoke passed: $app $route"
            done
            if [ "$app" = "portal" ]; then
              # No emails are sent: ensure unauthenticated cross-site requests
              # and invalid payloads are rejected by the real compiled API.
              result=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
                -H 'Origin: https://attacker.example' -H 'Content-Type: application/json' \
                --data '{"action":"recovery","email":"unused@example.invalid"}' \
                "http://127.0.0.1:39519/api/auth/email-action")
              [ "$result" = "403" ] || { echo "::error::Cross-origin auth email request was not rejected: $result"; exit 1; }
              result=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
                -H 'Origin: https://portal.landshopnigeria.com' -H 'Content-Type: text/plain' \
                --data 'bad' "http://127.0.0.1:39519/api/auth/email-action")
              [ "$result" = "415" ] || { echo "::error::Auth email API accepted invalid content type: $result"; exit 1; }
              result=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
                -H 'Origin: https://portal.landshopnigeria.com' -H 'Content-Type: application/json' \
                --data '{"action":"unknown","email":"unused@example.invalid"}' \
                "http://127.0.0.1:39519/api/auth/email-action")
              [ "$result" = "400" ] || { echo "::error::Auth email API accepted unknown action: $result"; exit 1; }
              echo "Verified bounded, origin-controlled public auth email API (no emails sent)"
            fi
            if [ "$app" = "portal" ] || [ "$app" = "dashboard" ]; then
              # Missing verification tokens must never create a session or cache a redirect.
              result=$(curl -sS --max-time 15 -D /tmp/landshop-auth-headers -o /dev/null \
                -w '%{http_code}' "http://127.0.0.1:39519/auth/callback")
              if [ "$result" != 307 ]; then
                echo "::error::$app signed-out callback returned HTTP $result instead of 307"
                kill "$pid" || true
                exit 1
              fi
              if ! grep -iq '^cache-control:.*no-store' /tmp/landshop-auth-headers; then
                echo "::error::$app verification redirect is cacheable"
                kill "$pid" || true
                exit 1
              fi
              echo "Verified safe uncached $app callback recovery redirect"
            fi
            if [ "$app" = "dashboard" ]; then
              # Assert approved staff copy and controls in actual server-rendered HTML.
              curl -fsS --max-time 15 "http://127.0.0.1:39519/staff/sign-in" -o /tmp/landshop-staff-signin.html
              curl -fsS --max-time 15 "http://127.0.0.1:39519/staff/sign-up" -o /tmp/landshop-staff-signup.html
              curl -fsS --max-time 15 "http://127.0.0.1:39519/staff/sign-up?role=owner" -o /tmp/landshop-owner-signup.html
              grep -Fq "Company Owner" /tmp/landshop-owner-signup.html || { echo "::error::Owner signup deep link does not render staff form"; exit 1; }
              for expected in "Welcome" "Enter your work email" "Enter your password" "Show password" "Forgot password?"; do
                grep -Fq "$expected" /tmp/landshop-staff-signin.html || { echo "::error::Staff sign-in missing: $expected"; exit 1; }
              done
              for expected in "Become a" "Landshop Staff" "Choose a username" "Enter your age" "Requested staff role" "Company Owner" "Create password" "Confirm password" "Show confirm password" "Terms and Conditions"; do
                grep -Fq "$expected" /tmp/landshop-staff-signup.html || { echo "::error::Staff sign-up missing: $expected"; exit 1; }
              done
              for forbidden in "Join the Landshop team" "Your photograph and work location are requested separately" "Sign Up as Staff"; do
                if grep -Fq "$forbidden" /tmp/landshop-staff-signup.html; then echo "::error::Removed staff copy has returned: $forbidden"; exit 1; fi
              done
              if grep -Fq "Sign in to your work dashboard. Only authorized" /tmp/landshop-staff-signin.html; then
                echo "::error::Removed sign-in paragraph has returned"; exit 1
              fi
              # Email confirmation is enough for entry to the PERSONAL staff dashboard.
              # Sensitive employee/management operations retain independent authorization.
              grep -Fq "selfServiceAccess={confirmedStaffSignup&&Boolean(profile)&&profile?.employment_state!=='suspended'&&profile?.employment_state!=='ended'}" apps/dashboard/app/staff/page.tsx || { echo "::error::Staff dashboard email activation missing"; exit 1; }
              grep -Fq "if(!dashboardActive)return" apps/dashboard/app/staff/StaffWorkspace.tsx || { echo "::error::Management gate still blocks personal dashboard"; exit 1; }
              grep -Fq "landshop_staff_can_work" apps/dashboard/app/staff/page.tsx || { echo "::error::Employee work authorization missing"; exit 1; }
              grep -Fq "landshop_is_management" apps/dashboard/app/staff/page.tsx || { echo "::error::Owner management gate missing"; exit 1; }
              # Owner membership alone is insufficient without landshop_is_management.
              # Once independently verified, the owner must be able to move between
              # the personal Staff Dashboard and every Command Center module.
              grep -Fq 'ownerAccess={verifiedOwner}' apps/dashboard/app/staff/page.tsx || { echo "::error::Trusted owner staff entitlement missing"; exit 1; }
              grep -Fq 'const dashboardActive=ownerActive||verified' apps/dashboard/app/staff/StaffWorkspace.tsx || { echo "::error::Owner dashboard incorrectly blocked by employee KYC"; exit 1; }
              grep -Fq 'ls25-owner-nav' apps/dashboard/app/staff/StaffWorkspace.tsx || { echo "::error::Owner Command Center navigation missing"; exit 1; }
              grep -Fq 'ls25-owner-access-cta' apps/dashboard/app/staff/StaffWorkspace.tsx || { echo "::error::Owner Command Center call to action missing"; exit 1; }
              grep -Fq "member.role==='owner'||(!ownerOnly" apps/dashboard/lib/admin-access.ts || { echo "::error::Global owner access across Command Center modules missing"; exit 1; }
              grep -Fq 'landshop_is_management' apps/dashboard/lib/admin-access.ts || { echo "::error::Owner authorization still requires live management RPC"; exit 1; }
              grep -Fq 'href="/staff?workspace=personal">Personal staff workspace →</Link>' apps/dashboard/app/admin/CommandWorkspace.tsx || { echo "::error::Return to Staff Dashboard missing"; exit 1; }
              echo "Verified owner full Command Center and two-way staff navigation checks passed"
              echo "Automatic dashboard activation with protected internal permissions verified"
              echo "Approved staff sign-in and sign-up UI regression smoke passed"
            fi
            kill "$pid" || true
            wait "$pid" || true
            echo "Standalone runtime startup and route smoke verified for $app"
          done
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python worker dependencies
        run: python -m pip install -r services/document-worker/requirements.txt
      - name: Test document parser and mortgage math
        working-directory: services/document-worker
        run: |
          python -m compileall -q .
          python -m unittest discover -p 'test_*.py' -v
      - name: Publish verifiable CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" = "success" ]; then state="success"; else state="failure"; fi
          python - <<'PY'
          import json,os
          status="success" if os.environ["BUILD_RESULT"]=="success" else "failure"
          payload={"state":status,"context":"landshop/validation",
          "description":"Landshop website, portal, dashboard and worker checks: "+status,
          "target_url":"https://github.com/"+os.environ["REPO"]+"/actions/runs/"+os.environ["RUN_ID"]}
          open("/tmp/landshop-status.json","w").write(json.dumps(payload))
          PY
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/landshop-status.json \
            "https://api.github.com/repos/$REPO/statuses/$COMMIT_SHA" >/dev/null
