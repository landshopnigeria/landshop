name: Validate Landshop Foundation
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'scripts/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/validate-foundation.yml'
      - '.github/workflows/deploy-landshop-enterprise.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://iwkfagzkogzidrbbezds.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
          NEXT_PUBLIC_PORTAL_URL: https://portal.landshopnigeria.com
          NEXT_PUBLIC_APP_URL: https://app.landshopnigeria.com
          NEXT_PUBLIC_LANDSHOP_RELEASE_SHA: ${{ github.sha }}
        run: |
          npm run build -w @landshop/website
          npm run build -w @landshop/portal
          npm run build -w @landshop/dashboard
      - name: Verify standalone cPanel release bundles and Node startup
        env:
          LANDSHOP_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/package-landshop-standalone.sh
          for app in website portal dashboard; do
            PORT=39519 HOSTNAME=127.0.0.1 node "release/$app/server.js" >"/tmp/landshop-$app.log" 2>&1 &
            pid=$!
            ready=false
            for attempt in $(seq 1 35); do
              if curl -fsS --max-time 2 "http://127.0.0.1:39519/api/release-health" > "/tmp/landshop-$app.json"; then
                ready=true
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              cat "/tmp/landshop-$app.log"
              exit 1
            fi
            SERVICE="landshop-$app" python3 - <<'PY'
          import json,os
          with open('/tmp/landshop-'+os.environ['SERVICE'].split('-')[1]+'.json') as file:
              result=json.load(file)
          assert result['service']==os.environ['SERVICE']
          assert result['status']=='serving-nextjs'
          assert result['commit']==os.environ['LANDSHOP_RELEASE_SHA']
          PY
            # Verify source-aligned product/application pages render, not just the health route.
            if [ "$app" = "website" ]; then
              routes=(/ /develop /incubate /grow /applications /properties)
            elif [ "$app" = "portal" ]; then
              routes=(/ /applications /applications/develop-house /applications/develop-land \
                /applications/incubate-investment /applications/beta-mortgage \
                /applications/mortgage-xtra /applications/develop-inspection \
                /applications/mortgage-xtra-inspection /calculator)
            else
              routes=(/ /dashboard)
            fi
            for route in "${routes[@]}";do
              code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
                "http://127.0.0.1:39519$route")
              if [ "$app" = "dashboard" ];then
                # Public guests must not receive private dashboard contents.
                case "$code" in 307|308) echo "Protected dashboard redirects unauthenticated visitor: $route";continue;; esac
              fi
              if [ "$code" != 200 ];then
                echo "::error::Landshop $app $route returned HTTP $code in standalone runtime"
                cat "/tmp/landshop-$app.log"
                kill "$pid" || true
                exit 1
              fi
              echo "SSR/route smoke passed: $app $route"
            done
            kill "$pid" || true
            wait "$pid" || true
            echo "Standalone runtime startup and route smoke verified for $app"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python worker dependencies
        run: python -m pip install -r services/document-worker/requirements.txt
      - name: Test document parser and mortgage math
        working-directory: services/document-worker
        run: |
          python -m compileall -q .
          python -m unittest discover -p 'test_*.py' -v
      - name: Publish verifiable CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" = "success" ]; then state="success"; else state="failure"; fi
          python - <<'PY'
          import json,os
          status="success" if os.environ["BUILD_RESULT"]=="success" else "failure"
          payload={"state":status,"context":"landshop/validation",
          "description":"Landshop website, portal, dashboard and worker checks: "+status,
          "target_url":"https://github.com/"+os.environ["REPO"]+"/actions/runs/"+os.environ["RUN_ID"]}
          open("/tmp/landshop-status.json","w").write(json.dumps(payload))
          PY
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/landshop-status.json \
            "https://api.github.com/repos/$REPO/statuses/$COMMIT_SHA" >/dev/null
