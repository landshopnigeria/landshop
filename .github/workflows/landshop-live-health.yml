name: Landshop live production health
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/landshop-live-health.yml']
permissions:
  contents: read
concurrency:
  group: landshop-live-health
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Verify live release parity and essential routes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from html.parser import HTMLParser
          from urllib.error import URLError, HTTPError

          main_sha=os.environ["EXPECTED_SHA"]
          assert len(main_sha)==40, "Expected full main branch commit"
          # Non-release commits can advance main without changing production.
          # Use the live website revision as baseline for cross-app parity.
          req=urllib.request.Request("https://landshopnigeria.com/api/release-health",
            headers={"User-Agent":"Landshop-Live-Health/1.0","Cache-Control":"no-store"})
          with urllib.request.urlopen(req,timeout=18) as resp:
            baseline=json.load(resp)
          expected=baseline.get("commit","")
          assert len(expected)==40 and all(c in "0123456789abcdef" for c in expected), "Invalid production release metadata"
          if expected!=main_sha:
            print("::warning::Production revision differs from main:",expected[:12],main_sha[:12])
          hosts={
            "website":"https://landshopnigeria.com",
            "www":"https://www.landshopnigeria.com",
            "portal":"https://portal.landshopnigeria.com",
            "dashboard":"https://app.landshopnigeria.com",
          }
          class ReleaseMeta(HTMLParser):
            def __init__(self):
              super().__init__()
              self.release=None
            def handle_starttag(self,tag,attrs):
              if tag=="meta":
                a=dict(attrs)
                if a.get("name")=="landshop-release": self.release=a.get("content")
          def get(url):
            request=urllib.request.Request(url,headers={
              "User-Agent":"Landshop-Live-Health/1.0",
              "Cache-Control":"no-cache, no-store","Pragma":"no-cache"})
            with urllib.request.urlopen(request,timeout=18) as response:
              status=response.status
              headers=response.headers
              body=response.read(2500000).decode("utf-8","replace")
              return status,headers,body
          errors=[]
          for name,origin in hosts.items():
            try:
              status,_,body=get(origin+"/api/release-health?probe="+expected[:12])
              data=json.loads(body)
              service="landshop-"+("website" if name=="www" else "dashboard" if name=="dashboard" else name)
              if status!=200 or data.get("status")!="serving-nextjs" or data.get("service")!=service or data.get("commit")!=expected:
                raise AssertionError("release health mismatch")
              print("PASS",name,"release",expected[:12])
            except (URLError,HTTPError,ValueError,AssertionError,TimeoutError) as exc:
              errors.append(f"{name} health: {type(exc).__name__}: {exc}")
          routes=[
            ("www","/",""),
            ("www","/projects/blue-diamonds","Blue Diamonds"),
            ("www","/properties/blue-diamonds","Blue Diamonds"),
            ("www","/projects/green-island","Green Island"),
            ("portal","/",""),
            ("dashboard","/staff/sign-in",""),
          ]
          for host,path,marker in routes:
            try:
              status,headers,body=get(hosts[host]+path)
              parsed=ReleaseMeta();parsed.feed(body)
              if status!=200 or "/_next/" not in body or parsed.release!=expected or (marker and marker not in body):
                raise AssertionError("missing page content, Next.js assets or exact release meta")
              if "no-store" not in headers.get("Cache-Control","").lower():
                raise AssertionError("HTML response can be cached stale")
              print("PASS",host+path,"HTML and release parity")
            except (URLError,HTTPError,AssertionError,TimeoutError) as exc:
              errors.append(f"{host}{path}: {type(exc).__name__}: {exc}")
          # A private Command Center must redirect unauthenticated users to
          # staff sign-in. A 404 is a broken deployment, not access control.
          try:
            from urllib.parse import urlsplit
            class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                return None
            opener=urllib.request.build_opener(NoRedirect())
            req=urllib.request.Request(hosts["dashboard"]+"/admin",headers={
              "User-Agent":"Landshop-Live-Health/1.0","Cache-Control":"no-store"})
            try:
              response=opener.open(req,timeout=18)
              status=response.status
              location=response.headers.get("Location","")
              response.close()
            except HTTPError as exc:
              status=exc.code
              location=exc.headers.get("Location","")
            destination=urlsplit(location)
            if status not in (302,303,307,308) or destination.path!="/staff/sign-in" or destination.netloc not in ("","app.landshopnigeria.com"):
              raise AssertionError(f"Command Center guest route returned {status}, redirect={location!r}")
            print("PASS dashboard/admin protected route redirects to staff sign-in")
          except (URLError,HTTPError,AssertionError,TimeoutError) as exc:
            errors.append(f"dashboard/admin route: {type(exc).__name__}: {exc}")
          if errors:
            for error in errors: print("::error::"+error)
            raise SystemExit(f"Production health failure ({len(errors)} checks). Investigate DNS, Passenger, routing and live commit.")
          print("PASS: Landshop production domains, estate routes and exact release parity")
          PY
