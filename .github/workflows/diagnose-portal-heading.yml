name: Diagnose Landshop Portal Public Heading
on:
  push:
    branches:
      - engineering/portal-visible-assertion-fix-20261029
    paths:
      - .github/workflows/diagnose-portal-heading.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public portal HTML with and without cache busting
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import json,re
          class H(HTMLParser):
            def __init__(self):super().__init__(convert_charrefs=True);self.level=0;self.buffer=[];self.headings=[]
            def handle_starttag(self,tag,attrs):
              if tag in ('h1','h2'):self.level+=1
            def handle_data(self,data):
              if self.level:self.buffer.append(data)
            def handle_endtag(self,tag):
              if tag in ('h1','h2') and self.level:
                self.level-=1
                if not self.level:self.headings.append(' '.join(' '.join(self.buffer).split()));self.buffer=[]
          urls=['https://portal.landshopnigeria.com/',
             'https://portal.landshopnigeria.com/?landshop_diagnostic=20261029A',
             'https://portal.landshopnigeria.com/?landshop_diagnostic=20261029B',
             'https://portal.landshopnigeria.com/api/release-health',
             'https://landshopnigeria.com/']
          for url in urls:
            with urlopen(Request(url,headers={'Cache-Control':'no-cache,no-store','Pragma':'no-cache','User-Agent':'Landshop-Public-Diagnostics/1'}),timeout=25) as f:
              data=f.read(380000).decode('utf-8','replace')
              print('URL',url,'STATUS',f.status,'LEN',len(data))
              print('HEADERS',{k:f.headers.get(k) for k in ['server','cache-control','age','x-nextjs-cache','x-cache','cf-cache-status','x-litespeed-cache','x-powered-by','etag'] if f.headers.get(k) is not None})
              if '/release-health' in url:print('RELEASE',data[:260]);continue
            h=H();h.feed(data);print('HEADINGS',repr(h.headings[:6]))
            print('CHUNKS',re.findall(r'/_next/static/[^"\s<>]+',data)[:3])
            print('EXPECTED NEW DESIGN', 'One Account.' in ' '.join(h.headings),'OLD DESIGN', 'Create your Landshop account' in ' '.join(h.headings))
          PY

      - name: Reject unauthenticated access to customer and management routes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,sys
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          client=urllib.request.build_opener(NoRedirect)
          routes=['/dashboard','/dashboard/account','/dashboard/kyc','/admin']
          errors=[]
          for route in routes:
              url='https://app.landshopnigeria.com'+route
              try:
                  response=client.open(urllib.request.Request(url,headers={'Cache-Control':'no-store','User-Agent':'Landshop-Guest-RBAC-Check/1'}),timeout=25)
                  status=response.status
                  redirect=response.headers.get('Location','')
              except urllib.error.HTTPError as error:
                  status=error.code
                  redirect=error.headers.get('Location','')
              ok=status in (307,308,302,303) and redirect.startswith('https://portal.landshopnigeria.com/')
              print(('PASS' if ok else 'FAIL'),route,'HTTP',status,'redirects_to_portal',redirect.startswith('https://portal.landshopnigeria.com/'))
              if not ok:errors.append(route)
          if errors:sys.exit('::error::Unauthenticated protected route boundary failure: '+','.join(errors))
          print('PASS: 4/4 protected routes reject guest sessions')
          PY
