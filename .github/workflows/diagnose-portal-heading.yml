name: Diagnose Landshop Portal Public Heading
on:
  push:
    branches:
      - engineering/portal-visible-assertion-fix-20261029
    paths:
      - .github/workflows/diagnose-portal-heading.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only public portal h1 and h2 headings
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          import re
          class H(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=True);self.level=0;self.buffer=[];self.headings=[]
            def handle_starttag(self,tag,attrs):
              if tag in ('h1','h2'):self.level+=1
            def handle_data(self,data):
              if self.level:self.buffer.append(data)
            def handle_endtag(self,tag):
              if tag in ('h1','h2') and self.level:
                self.level-=1
                if not self.level:self.headings.append(' '.join(' '.join(self.buffer).split()));self.buffer=[]
          u='https://portal.landshopnigeria.com/'
          with urlopen(Request(u,headers={'Cache-Control':'no-cache','User-Agent':'Landshop-Portal-Public-Heading-Audit/1'}),timeout=25) as f:
            raw=f.read(350000).decode('utf-8','replace')
            print('Status',f.status,'HTML bytes',len(raw),'NextJS', '/_next/' in raw)
          h=H();h.feed(raw)
          print('PUBLIC HEADING TEXTS:',repr(h.headings[:8]))
          print('Is One Account visible?', 'One Account.' in ' '.join(h.headings))
          print('Contains Welcome Back?', 'Welcome Back' in ' '.join(h.headings))
          PY
