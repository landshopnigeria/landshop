name: Generate faithful transparent Landshop brand PNGs
on:
  push:
    branches:
      - feat/transparent-clickable-landshop-logo-20261103
    paths:
      - .github/workflows/prepare-landshop-transparent-logo.yml
permissions:
  contents: write
jobs:
  make-transparent-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact transparent PNGs from approved logo
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/prepare-transparent-logo.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from hashlib import sha256
          outputs=[]
          for app in ('website','portal','dashboard'):
              file=Path('apps')/app/'public/media/logo-transparent.png'
              with Image.open(file) as image:
                  rgba=image.convert('RGBA')
                  a=rgba.getchannel('A')
                  extrema=a.getextrema()
                  clear=sum(1 for value in a.getdata() if value==0)
                  ratio=clear/(image.width*image.height)
                  if extrema[0]!=0 or extrema[1]!=255 or ratio<.1:
                      raise SystemExit(f'Unacceptable PNG transparency: {file} extrema={extrema} transparent_ratio={ratio:.1%}')
                  print('VALIDATED',file,'dimensions',image.size,'clear pixels',f'{ratio:.1%}')
              outputs.append(sha256(file.read_bytes()).hexdigest())
          if len(set(outputs))!=1:
              raise SystemExit('Transparent logo variants differ between apps')
          print('PASS: identical approved transparent logo across all three web apps')
          PY
      - name: Check in three generated logos and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "landshop-release-bot"
          git config user.email "landshop-release-bot@users.noreply.github.com"
          git add apps/website/public/media/logo-transparent.png apps/portal/public/media/logo-transparent.png apps/dashboard/public/media/logo-transparent.png
          git rm .github/workflows/prepare-landshop-transparent-logo.yml
          git commit -m "assets(brand): check in identical transparent Landshop PNGs for all applications"
          git pull --rebase origin feat/transparent-clickable-landshop-logo-20261103
          git push origin HEAD:feat/transparent-clickable-landshop-logo-20261103
