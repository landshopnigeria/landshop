name: Import owner-verified Merit Park historical photo
on:
  push:
    branches:
      - feature/merit-green-historical-project-evidence-20261101
    paths:
      - '.github/workflows/import-merit-park-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-landshop-merit-historical-media
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve owner's original historical photo
        run: |
          set -euo pipefail
          mkdir -p apps/website/public/owner/2026
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            'https://at.adobe.com/Sqdq7BNzX4psGpbc' \
            -o apps/website/public/owner/2026/merit-park-archival-signage.jpg
          echo '227450e4f813c5cc150e0aca0d42344f321f06cd981b1dec1725b194a1c3f42b  apps/website/public/owner/2026/merit-park-archival-signage.jpg' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/website/public/owner/2026/merit-park-archival-signage.jpg')
          data=p.read_bytes()
          if len(data)>950000 or len(data)<100000 or not data.startswith(b'\xff\xd8\xff'):
            raise SystemExit('Photo download is not an approved JPEG')
          print('Verified historical owner photo: 1600x1200 JPEG with no embedded EXIF,', len(data), 'bytes')
          PY
      - name: Save reviewed project archive asset to branch
        run: |
          set -euo pipefail
          git config user.name "landshop-owner-media-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/public/owner/2026/merit-park-archival-signage.jpg
          if git diff --cached --quiet; then echo 'Archived photo already committed'; exit 0; fi
          git commit -m "Import genuine historical photo naming Merit Park in original project signage"
          git push origin HEAD:feature/merit-green-historical-project-evidence-20261101
