name: Release Landshop Enterprise Applications to Namecheap
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Validate Landshop Foundation']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: landshop-enterprise-release
  cancel-in-progress: false
jobs:
  build_and_release:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: landshop-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify authorized Namecheap production connection
        env:
          PUBLIC_URL: ${{ vars.LANDSHOP_SUPABASE_URL || 'https://iwkfagzkogzidrbbezds.supabase.co' }}
          PUBLIC_KEY: ${{ vars.LANDSHOP_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Sr9kTfUUoqRY_D0f65V2Iw_nCsES8NC' }}
          SSH_HOST: ${{ secrets.LANDSHOP_SSH_HOST || secrets.NAMECHEAP_SSH_HOST || vars.LANDSHOP_SSH_HOST }}
          SSH_PORT: ${{ vars.LANDSHOP_SSH_PORT || secrets.LANDSHOP_SSH_PORT || secrets.NAMECHEAP_SSH_PORT || '21098' }}
          SSH_USER: ${{ secrets.LANDSHOP_SSH_USER || secrets.NAMECHEAP_SSH_USER || vars.LANDSHOP_SSH_USER }}
          SSH_KEY: ${{ secrets.LANDSHOP_SSH_KEY || secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LANDSHOP_SSH_KNOWN_HOSTS || secrets.NAMECHEAP_SSH_KNOWN_HOSTS || vars.LANDSHOP_SSH_KNOWN_HOSTS }}
          WEBSITE_APPROOT: ${{ secrets.LANDSHOP_WEBSITE_APPROOT || vars.LANDSHOP_WEBSITE_APPROOT || '/home/maleghif/landshop-website' }}
          PORTAL_APPROOT: ${{ secrets.LANDSHOP_PORTAL_APPROOT || vars.LANDSHOP_PORTAL_APPROOT || '/home/maleghif/landshop-portal' }}
          DASHBOARD_APPROOT: ${{ secrets.LANDSHOP_DASHBOARD_APPROOT || vars.LANDSHOP_DASHBOARD_APPROOT || '/home/maleghif/landshop-app' }}
          CPANEL_ROUTED: ${{ vars.LANDSHOP_CPANEL_APPS_ROUTED || secrets.LANDSHOP_CPANEL_APPS_ROUTED || 'true' }}
        run: |
          set -euo pipefail
          missing=()
          for name in PUBLIC_URL PUBLIC_KEY SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS WEBSITE_APPROOT PORTAL_APPROOT DASHBOARD_APPROOT; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing hosting configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          if [ "$CPANEL_ROUTED" != "true" ]; then
            echo "::error::cPanel Setup Node.js App URLs/startup files must be verified and LANDSHOP_CPANEL_APPS_ROUTED=true."
            exit 1
          fi
          [[ "$PUBLIC_URL" == https://iwkfagzkogzidrbbezds.supabase.co ]] || { echo '::error::Incorrect Landshop Supabase project'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm V4 original assets committed
        run: |
          set -euo pipefail
          for app in website portal dashboard; do
            test -s "apps/$app/public/media/logo.webp" || { echo "::error::$app is missing approved image assets"; exit 1; }
          done
          for img in deck-building.webp deck-investment.webp deck-mortgage.webp famous0.webp maiyegun0.webp; do
            test -s "apps/website/public/media/$img" || { echo "::error::Missing V4 estate image $img"; exit 1; }
          done
      - name: Verify real Nigerian editorial photo CDN assets
        run: python3 scripts/validate-genuine-photos.py
      - name: Prepare faithful transparent Landshop PNG logo
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/prepare-transparent-logo.py
          test -s apps/website/public/media/logo-transparent.png
      - name: Verify owner-provided real photography and all editorial mappings
        run: python3 scripts/verify-landshop-owner-media.py
      - name: Install and validate
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build -w @landshop/website
          npm run build -w @landshop/portal
          npm run build -w @landshop/dashboard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.LANDSHOP_SUPABASE_URL || 'https://iwkfagzkogzidrbbezds.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LANDSHOP_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Sr9kTfUUoqRY_D0f65V2Iw_nCsES8NC' }}
          NEXT_PUBLIC_LANDSHOP_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Package standalone releases
        env:
          LANDSHOP_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/package-landshop-standalone.sh
      - name: Prepare trusted SSH
        env:
          SSH_PORT: ${{ vars.LANDSHOP_SSH_PORT || secrets.LANDSHOP_SSH_PORT || secrets.NAMECHEAP_SSH_PORT || '21098' }}
          SSH_KEY: ${{ secrets.LANDSHOP_SSH_KEY || secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.LANDSHOP_SSH_KNOWN_HOSTS || secrets.NAMECHEAP_SSH_KNOWN_HOSTS || vars.LANDSHOP_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.LANDSHOP_SSH_HOST || secrets.NAMECHEAP_SSH_HOST || vars.LANDSHOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LANDSHOP_SSH_USER || secrets.NAMECHEAP_SSH_USER || vars.LANDSHOP_SSH_USER }}
          WEBSITE_ROOT: ${{ secrets.LANDSHOP_WEBSITE_APPROOT || vars.LANDSHOP_WEBSITE_APPROOT || '/home/maleghif/landshop-website' }}
          PORTAL_ROOT: ${{ secrets.LANDSHOP_PORTAL_APPROOT || vars.LANDSHOP_PORTAL_APPROOT || '/home/maleghif/landshop-portal' }}
          DASHBOARD_ROOT: ${{ secrets.LANDSHOP_DASHBOARD_APPROOT || vars.LANDSHOP_DASHBOARD_APPROOT || '/home/maleghif/landshop-app' }}
        run: |
          set -euo pipefail
          for name in SSH_KEY KNOWN_HOSTS SSH_HOST SSH_USER WEBSITE_ROOT PORTAL_ROOT DASHBOARD_ROOT; do
            if [ -z "${!name:-}" ];then echo "::error::Missing deployment secret $name";exit 1;fi
          done
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || { echo '::error::Invalid SSH port'; exit 1; }
          for root in "$WEBSITE_ROOT" "$PORTAL_ROOT" "$DASHBOARD_ROOT";do
            [[ "$root" == /home/* && "$root" != *".."* && "$root" != */public_html* ]] || { echo "::error::Unsafe Node app root";exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify migrations, encrypted backup and recovery evidence before production upload
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.LANDSHOP_SUPABASE_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Production database URL is not configured"; exit 1; }
          # Require the actual verified encrypted backup AND isolated PostgreSQL recovery exercise.
          for run_id in 40500325257 40799262978; do
            run_json=$(curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            conclusion=$(RUN_JSON="$run_json" python3 -c 'import json,os;print(json.loads(os.environ["RUN_JSON"]).get("conclusion",""))')
            [ "$conclusion" = success ] || { echo "::error::Required backup/recovery run $run_id did not pass";exit 1; }
            echo "Verified successful recovery prerequisite: workflow run $run_id"
          done
          # Verify live migration history and RLS without mutating Supabase or relying on a manual flag.
          read -r -d '' sql <<'SQL' || true
          select case when
            (select count(*) from supabase_migrations.schema_migrations
             where name in ('application_submission_validation','support_ticketing'))=2
            and to_regclass('public.support_tickets') is not null
            and to_regclass('public.support_ticket_events') is not null
            and to_regprocedure('public.landshop_submit_application(uuid)') is not null
            and exists(select 1 from pg_trigger
              where tgrelid='auth.users'::regclass
                and tgname='landshop_auth_user_profile_created' and tgenabled <> 'D')
            and exists(select 1 from information_schema.columns
              where table_schema='public' and table_name='profiles' and column_name='display_username')
            and (select relrowsecurity from pg_class where oid='public.support_tickets'::regclass)
            and not has_table_privilege('anon','public.support_tickets','SELECT')
          then 'ready' else 'not-ready' end
          SQL
          result=$(docker run --rm --network host -e DATABASE_URL -e SQL="$sql" postgres:17 \
             sh -ec 'psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -c "$SQL"')
          [ "$result" = ready ] || { echo "::error::Production database migration/RLS verification failed";exit 1; }
          echo "Production SQL migration and RLS gate verified from live database"
          # Read-only access-control audit: blocks a release if staff applications
          # gain direct write policies, privileged roles lose owner approval,
          # or unverified staff can execute protected work.
          staff_result=$(docker run --rm --network host -e DATABASE_URL \
            -v "$PWD/scripts/verify-staff-approval.sql:/verify-staff-approval.sql:ro" postgres:17 \
            sh -ec 'psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -f /verify-staff-approval.sql')
          [ "$staff_result" = ready ] || { echo "::error::Landshop staff approval security gate failed"; exit 1; }
          echo "Production staff role, identity and approval safeguards verified"
          # Staff task directory and supervisor performance reports must remain
          # scoped to verified staff and the assigning supervisor.
          task_result=$(docker run --rm --network host -e DATABASE_URL \
            -v "$PWD/scripts/verify-staff-task-security.sql:/verify-staff-task-security.sql:ro" postgres:17 \
            sh -ec 'psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -f /verify-staff-task-security.sql')
          [ "$task_result" = ready ] || { echo "::error::Staff task scope and permission gate failed"; exit 1; }
          echo "Production staff task authorization safeguards verified"
          for host in landshopnigeria.com www.landshopnigeria.com portal.landshopnigeria.com app.landshopnigeria.com; do
            curl --fail --silent --show-error --location --max-time 18 --head "https://$host/" >/dev/null || {
              echo "::error::Production domain $host does not have valid TLS/HTTP routing"
              exit 1
            }
            echo "TLS and response verified for $host"
          done
      - name: Audit Namecheap website routing and legacy document-root files
        shell: bash
        env:
          SSH_PORT: ${{ vars.LANDSHOP_SSH_PORT || secrets.LANDSHOP_SSH_PORT || secrets.NAMECHEAP_SSH_PORT || '21098' }}
          SSH_HOST: ${{ secrets.LANDSHOP_SSH_HOST || secrets.NAMECHEAP_SSH_HOST || vars.LANDSHOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LANDSHOP_SSH_USER || secrets.NAMECHEAP_SSH_USER || vars.LANDSHOP_SSH_USER }}
          WEBSITE_ROOT: ${{ secrets.LANDSHOP_WEBSITE_APPROOT || vars.LANDSHOP_WEBSITE_APPROOT || '/home/maleghif/landshop-website' }}
          PORTAL_ROOT: ${{ secrets.LANDSHOP_PORTAL_APPROOT || vars.LANDSHOP_PORTAL_APPROOT || '/home/maleghif/landshop-portal' }}
          DASHBOARD_ROOT: ${{ secrets.LANDSHOP_DASHBOARD_APPROOT || vars.LANDSHOP_DASHBOARD_APPROOT || '/home/maleghif/landshop-app' }}
        run: |
          set -euo pipefail
          # Read-only. Prints route and release metadata, never env files or credentials.
          ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s -- "$WEBSITE_ROOT" "$PORTAL_ROOT" "$DASHBOARD_ROOT" <<'REMOTE'
          set -eu
          for app in website portal dashboard; do
            case "$app" in website) root="$1";;portal) root="$2";;dashboard) root="$3";;esac
            echo "DEPLOYED_APP=$app"
            test -s "$root/server.js" || { echo "ERROR: Passenger entry missing"; exit 1; }
            if test -s "$root/LANDSHOP_RELEASE_SHA";then
              printf '  release=';head -c 40 "$root/LANDSHOP_RELEASE_SHA";echo
            else echo "  release=missing";fi
            if test -s "$root/apps/$app/.next/BUILD_ID";then
              printf '  build_id=';head -c 80 "$root/apps/$app/.next/BUILD_ID";echo
            else echo "  build_id=missing";fi
            test -d "$root/apps/$app/.next/static" || { echo "ERROR: static asset directory missing"; exit 1; }
            echo "  static_assets_present=true"
          done
          for file in "$HOME/public_html/wp-config.php" "$HOME/public_html/index.php" "$HOME/public_html/index.html"; do
            if test -f "$file"; then
              printf 'DOCROOT_LEGACY_FILE_PRESENT=%s\n' "${file##*/}"
            fi
          done
          if test -f "$HOME/public_html/.htaccess";then
            echo "DOCROOT_ROUTING_RULES:"
            grep -Ei '^([[:space:]]*Passenger|[[:space:]]*Rewrite|[[:space:]]*# BEGIN WordPress|[[:space:]]*# END WordPress)' "$HOME/public_html/.htaccess" | head -25 || true
          fi
          userdir="$HOME/.cpanel/userdata/$(id -un)"
          for domain in landshopnigeria.com www.landshopnigeria.com portal.landshopnigeria.com app.landshopnigeria.com; do
            if test -f "$userdir/$domain"; then
              echo "CPANEL_DOMAIN=$domain"
              grep -E '^(documentroot|servername|serveralias):' "$userdir/$domain" || true
            fi
          done
          REMOTE
      - name: Back up existing production Next.js release before overwriting
        shell: bash
        env:
          SSH_PORT: ${{ vars.LANDSHOP_SSH_PORT || secrets.LANDSHOP_SSH_PORT || secrets.NAMECHEAP_SSH_PORT || '21098' }}
          SSH_HOST: ${{ secrets.LANDSHOP_SSH_HOST || secrets.NAMECHEAP_SSH_HOST || vars.LANDSHOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LANDSHOP_SSH_USER || secrets.NAMECHEAP_SSH_USER || vars.LANDSHOP_SSH_USER }}
          WEBSITE_ROOT: ${{ secrets.LANDSHOP_WEBSITE_APPROOT || vars.LANDSHOP_WEBSITE_APPROOT || '/home/maleghif/landshop-website' }}
          PORTAL_ROOT: ${{ secrets.LANDSHOP_PORTAL_APPROOT || vars.LANDSHOP_PORTAL_APPROOT || '/home/maleghif/landshop-portal' }}
          DASHBOARD_ROOT: ${{ secrets.LANDSHOP_DASHBOARD_APPROOT || vars.LANDSHOP_DASHBOARD_APPROOT || '/home/maleghif/landshop-app' }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s -- \
            "$WEBSITE_ROOT" "$PORTAL_ROOT" "$DASHBOARD_ROOT" "$GITHUB_RUN_ID" <<'REMOTE'
          set -eu
          path_site="$1";path_portal="$2";path_app="$3";release_id="$4"
          case "$release_id" in *[!0-9]*|'') exit 1;; esac
          backup="$HOME/landshop-deployment-backups/release-$release_id"
          mkdir -p "$backup"
          chmod 700 "$backup"
          for app in website portal dashboard;do
            case "$app" in
              website) root="$path_site";;
              portal) root="$path_portal";;
              dashboard) root="$path_app";;
            esac
            case "$root" in /home/*) ;; *) echo "Unsafe app backup path";exit 1;; esac
            test -s "$root/server.js" && test -s "$root/LANDSHOP_RELEASE_SHA" || exit 1
            # Save an immutable snapshot on the same account; must succeed before any upload.
            tar -czf "$backup/$app-pre-release.tar.gz" -C "$root" --exclude=tmp --exclude='*.env*' .
            test -s "$backup/$app-pre-release.tar.gz"
            echo "Verified encrypted-transport backup artifact for $app"
          done
          REMOTE
      - name: Upload verified release to existing Passenger applications
        env:
          SSH_PORT: ${{ vars.LANDSHOP_SSH_PORT || secrets.LANDSHOP_SSH_PORT || secrets.NAMECHEAP_SSH_PORT || '21098' }}
          SSH_HOST: ${{ secrets.LANDSHOP_SSH_HOST || secrets.NAMECHEAP_SSH_HOST || vars.LANDSHOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LANDSHOP_SSH_USER || secrets.NAMECHEAP_SSH_USER || vars.LANDSHOP_SSH_USER }}
          WEBSITE_ROOT: ${{ secrets.LANDSHOP_WEBSITE_APPROOT || vars.LANDSHOP_WEBSITE_APPROOT || '/home/maleghif/landshop-website' }}
          PORTAL_ROOT: ${{ secrets.LANDSHOP_PORTAL_APPROOT || vars.LANDSHOP_PORTAL_APPROOT || '/home/maleghif/landshop-portal' }}
          DASHBOARD_ROOT: ${{ secrets.LANDSHOP_DASHBOARD_APPROOT || vars.LANDSHOP_DASHBOARD_APPROOT || '/home/maleghif/landshop-app' }}
        run: |
          set -euo pipefail
          target="$SSH_USER@$SSH_HOST"
          ssh_args=(-p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          roots=("$WEBSITE_ROOT" "$PORTAL_ROOT" "$DASHBOARD_ROOT")
          apps=(website portal dashboard)
          # Backups were verified in the previous step. Mark the point at which
          # production is about to change so rollback only runs after upload begins.
          ssh "${ssh_args[@]}" "$target" "touch \"\$HOME/landshop-deployment-backups/release-$GITHUB_RUN_ID/.upload-started\""
          for i in 0 1 2;do
            root="${roots[$i]}";app="${apps[$i]}"
            remote_path=$(printf '%q' "$root")
            ssh "${ssh_args[@]}" "$target" "set -eu; test -d $remote_path; mkdir -p $remote_path/tmp"
            # Keep the app root, environment secrets, application data and Passenger restart directory intact.
            # Next's standalone .next tree is a GENERATED build artifact, not customer storage.
            # Stale ISR/pre-rendered HTML can otherwise survive partial rsync updates and make
            # /api/release-health report the new commit while / still renders the previous UI.
            test -s "release/$app/apps/$app/.next/BUILD_ID" || {
              echo "::error::Missing generated Next.js BUILD_ID for $app"
              exit 1
            }
            rsync -az --exclude='tmp/' --exclude='.env*' --exclude="apps/$app/.next/" \
              -e "ssh -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
              "release/$app/" "$target:$root/"
            # The only --delete scope is inside that app's generated Next.js build folder.
            # No environment file, uploads, database or user-managed directory is removed.
            rsync -az --delete -e "ssh -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
              "release/$app/apps/$app/.next/" "$target:$root/apps/$app/.next/"
            ssh "${ssh_args[@]}" "$target" "touch $remote_path/tmp/restart.txt"
          done
      - name: Verify all three domains serve the newly published Next.js applications
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # cPanel Passenger may keep the previous Node worker briefly after tmp/restart.txt.
          # Retry exact-commit checks without accepting stale or static fallback content.
          python3 - <<'PY'
          import json,os,time,urllib.request
          expected=os.environ['RELEASE_SHA']
          for app,base in [
           ('website','https://landshopnigeria.com'),
           ('portal','https://portal.landshopnigeria.com'),
           ('dashboard','https://app.landshopnigeria.com')]:
            ok=False
            for attempt in range(1,19):
             try:
              req=urllib.request.Request(base+'/api/release-health?release='+expected[:12]+'&attempt='+str(attempt),
                headers={'Cache-Control':'no-store, no-cache','Pragma':'no-cache','User-Agent':'Landshop-Release-Verification/1.0'})
              with urllib.request.urlopen(req,timeout=25) as response:
               body=json.load(response)
              if body.get('service')=='landshop-'+app and body.get('commit')==expected and body.get('status')=='serving-nextjs':
               print(f"Verified {app} exact commit {expected[:12]} after {attempt} attempt(s)",flush=True)
               ok=True
               break
              print(f"Still waiting for {app} Passenger restart: attempt {attempt}, reported commit {str(body.get('commit'))[:12]}",flush=True)
             except Exception as exc:
              print(f"{app} health not yet ready on attempt {attempt}: {type(exc).__name__}",flush=True)
             if attempt<18: time.sleep(8)
            if not ok:
             raise SystemExit('ERROR: '+app+' never served the expected exact Next.js release; rollback required')
          PY
      - name: Assert real public UI, forms, product routes and navigation (not only health JSON)
        shell: bash
        run: python3 scripts/check-landshop-public-pages.py
      - name: Assert all 31 new owner photographs are publicly served
        env:
          LANDSHOP_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/check-landshop-live-owner-photos.py
      - name: Verify actual browser HTML, CSS, JavaScript and release parity on apex + www
        shell: bash
        env:
          LANDSHOP_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/check-landshop-live-assets.py

      - name: Automatically restore previous application snapshots if release verification fails
        if: ${{ failure() }}
        shell: bash
        env:
          SSH_PORT: ${{ vars.LANDSHOP_SSH_PORT || secrets.LANDSHOP_SSH_PORT || secrets.NAMECHEAP_SSH_PORT || '21098' }}
          SSH_HOST: ${{ secrets.LANDSHOP_SSH_HOST || secrets.NAMECHEAP_SSH_HOST || vars.LANDSHOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LANDSHOP_SSH_USER || secrets.NAMECHEAP_SSH_USER || vars.LANDSHOP_SSH_USER }}
          WEBSITE_ROOT: ${{ secrets.LANDSHOP_WEBSITE_APPROOT || vars.LANDSHOP_WEBSITE_APPROOT || '/home/maleghif/landshop-website' }}
          PORTAL_ROOT: ${{ secrets.LANDSHOP_PORTAL_APPROOT || vars.LANDSHOP_PORTAL_APPROOT || '/home/maleghif/landshop-portal' }}
          DASHBOARD_ROOT: ${{ secrets.LANDSHOP_DASHBOARD_APPROOT || vars.LANDSHOP_DASHBOARD_APPROOT || '/home/maleghif/landshop-app' }}
        run: |
          set -euo pipefail
          if [ ! -s "$HOME/.ssh/id_ed25519" ] || [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ];then
            echo "No authenticated upload took place; no remote rollback is necessary."
            exit 0
          fi
          ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s -- \
            "$WEBSITE_ROOT" "$PORTAL_ROOT" "$DASHBOARD_ROOT" "$GITHUB_RUN_ID" <<'REMOTE'
          set -eu
          web="$1";portal="$2";dashboard="$3";release_id="$4"
          case "$release_id" in *[!0-9]*|'') exit 1;; esac
          backup="$HOME/landshop-deployment-backups/release-$release_id"
          if [ ! -f "$backup/.upload-started" ];then
            echo "Upload never started; existing production assets were not replaced."
            exit 0
          fi
          for app in website portal dashboard;do
            case "$app" in website)root="$web";;portal)root="$portal";;dashboard)root="$dashboard";;esac
            archive="$backup/$app-pre-release.tar.gz"
            test -s "$archive" || { echo "ERROR: Missing prior release snapshot for $app";exit 1; }
            case "$root" in /home/*) ;; *) echo "Unsafe rollback root";exit 1;; esac
            # Remove ONLY generated Next.js output; preserve .env, uploads and customer data.
            if test -d "$root/apps/$app/.next";then rm -rf -- "$root/apps/$app/.next";fi
            tar -xzf "$archive" -C "$root"
            test -s "$root/server.js"
            mkdir -p "$root/tmp"
            touch "$root/tmp/restart.txt"
            echo "Restored previous $app deployment from release $release_id"
          done
          REMOTE
          echo "::warning::Landshop release verification failed; previous snapshots restored and Passenger restarts requested."
