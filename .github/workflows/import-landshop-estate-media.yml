name: Import Landshop Estate Assets (one-time)
on:
  push:
    paths:
      - '.github/workflows/import-landshop-estate-media.yml'
permissions:
  contents: write
concurrency:
  group: landshop-media-import
  cancel-in-progress: false
jobs:
  import-estate-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch owner-supplied, optimized estate image archive
        env:
          MEDIA_SOURCE: https://at.adobe.com/BTDmKUZWgldYTpSI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 100 --retry 2 "$MEDIA_SOURCE" --output /tmp/landshop-estates.zip
          test "$(stat -c%s /tmp/landshop-estates.zip)" -gt 100000
          unzip -tq /tmp/landshop-estates.zip
          unzip -Z1 /tmp/landshop-estates.zip | while IFS= read -r path; do
            [[ "$path" =~ ^apps/website/public/estates/(green-island|maiyegun-beach-estate|blue-diamonds)/[a-z0-9-]+\.webp$ ]] || { echo "Unsafe asset path: $path"; exit 1; }
          done
          unzip -qo /tmp/landshop-estates.zip -d .
          test -f apps/website/public/estates/green-island/site-progress-1.webp
          test -f apps/website/public/estates/maiyegun-beach-estate/coastal-site.webp
          test -f apps/website/public/estates/blue-diamonds/entrance-concept.webp
      - name: Commit optimized images and remove one-time import workflow
        run: |
          set -euo pipefail
          git config user.name "landshop-media-import[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/public/estates/
          git rm -- .github/workflows/import-landshop-estate-media.yml
          git diff --cached --quiet && exit 0
          git commit -m "assets: add owner-supplied optimized Green Island, Maiyegun and Blue Diamonds galleries"
          git push origin HEAD:main
