name: Validate Landshop Production Backup Capacity
on:
  push:
    branches: [engineering/forms-and-production-diagnostics-20261027]
    paths: ['.github/workflows/prepare-landshop-production-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landshop-production-backup-readiness
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: landshop-production
    timeout-minutes: 10
    steps:
      - name: Check production directory size and rollback paths (read-only)
        shell: bash
        env:
          SSH_HOST: ${{ secrets.LANDSHOP_SSH_HOST || secrets.NAMECHEAP_SSH_HOST || vars.LANDSHOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LANDSHOP_SSH_USER || secrets.NAMECHEAP_SSH_USER || vars.LANDSHOP_SSH_USER }}
          SSH_PORT: ${{ vars.LANDSHOP_SSH_PORT || secrets.LANDSHOP_SSH_PORT || secrets.NAMECHEAP_SSH_PORT || '21098' }}
          SSH_KEY: ${{ secrets.LANDSHOP_SSH_KEY || secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.LANDSHOP_SSH_KNOWN_HOSTS || secrets.NAMECHEAP_SSH_KNOWN_HOSTS || vars.LANDSHOP_SSH_KNOWN_HOSTS }}
          WEBSITE_ROOT: ${{ secrets.LANDSHOP_WEBSITE_APPROOT || vars.LANDSHOP_WEBSITE_APPROOT || '/home/maleghif/landshop-website' }}
          PORTAL_ROOT: ${{ secrets.LANDSHOP_PORTAL_APPROOT || vars.LANDSHOP_PORTAL_APPROOT || '/home/maleghif/landshop-portal' }}
          DASHBOARD_ROOT: ${{ secrets.LANDSHOP_DASHBOARD_APPROOT || vars.LANDSHOP_DASHBOARD_APPROOT || '/home/maleghif/landshop-app' }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY KNOWN_HOSTS;do [ -n "${!name:-}" ] || { echo "::error::$name missing";exit 1;};done
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" bash -s -- "$WEBSITE_ROOT" "$PORTAL_ROOT" "$DASHBOARD_ROOT" <<'REMOTE'
          set -eu
          echo "=== Namecheap release snapshot readiness ==="
          df -Pk "$HOME" | awk 'NR==2{print "Filesystem free space (KiB):", $4}'
          for app in website portal dashboard;do
            case "$app" in website) root="$1";;portal) root="$2";;dashboard) root="$3";;esac
            case "$root" in /home/*) ;; *)echo "Invalid root";exit 1;;esac
            echo "-- $app --"
            test -f "$root/LANDSHOP_RELEASE_SHA" || { echo "::error::Previous release signature missing";exit 1;}
            test -s "$root/server.js" || { echo "::error::Startup file missing";exit 1;}
            du -sk "$root" | awk '{print "Uncompressed application footprint (KiB):",$1}'
            printf 'Current committed release: ';head -c 40 "$root/LANDSHOP_RELEASE_SHA";echo
          done
          echo "Main domain routing backed up location exists (if prior repair ran):"
          [ -d "$HOME/landshop-deployment-backups" ] && echo "yes" || echo "no"
          if [ -f "$HOME/public_html/.htaccess" ];then
            grep -q 'PassengerAppRoot.*landshop-website' "$HOME/public_html/.htaccess" && echo "Main Passenger route present" || echo "Main route requires attention"
          fi
          echo "No application data, credentials, or customer records printed. No changes made."
          REMOTE
