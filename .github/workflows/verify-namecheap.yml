
name: Verify Landshop Namecheap SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/landshop_deploy
          chmod 600 ~/.ssh/landshop_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test Namecheap connection
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
        run: |
          ssh -i ~/.ssh/landshop_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p "$PORT" "$USER@$HOST" \
            'whoami && pwd && ls -ld \
            ~/landshop-website \
            ~/landshop-app \
            ~/landshop-portal'
