name: Create Landshop Namecheap Pre-Promotion Rollback Snapshot
on:
  push:
    branches: [engineering/forms-and-production-diagnostics-20261027]
    paths: ['.github/workflows/create-namecheap-rollback-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landshop-production-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: landshop-production
    timeout-minutes: 15
    steps:
      - name: Snapshot currently serving three Next.js apps without downtime
        shell: bash
        env:
          SSH_HOST: ${{ secrets.LANDSHOP_SSH_HOST || secrets.NAMECHEAP_SSH_HOST || vars.LANDSHOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LANDSHOP_SSH_USER || secrets.NAMECHEAP_SSH_USER || vars.LANDSHOP_SSH_USER }}
          SSH_PORT: ${{ vars.LANDSHOP_SSH_PORT || secrets.LANDSHOP_SSH_PORT || secrets.NAMECHEAP_SSH_PORT || '21098' }}
          SSH_KEY: ${{ secrets.LANDSHOP_SSH_KEY || secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.LANDSHOP_SSH_KNOWN_HOSTS || secrets.NAMECHEAP_SSH_KNOWN_HOSTS || vars.LANDSHOP_SSH_KNOWN_HOSTS }}
          WEBSITE_ROOT: ${{ secrets.LANDSHOP_WEBSITE_APPROOT || vars.LANDSHOP_WEBSITE_APPROOT || '/home/maleghif/landshop-website' }}
          PORTAL_ROOT: ${{ secrets.LANDSHOP_PORTAL_APPROOT || vars.LANDSHOP_PORTAL_APPROOT || '/home/maleghif/landshop-portal' }}
          DASHBOARD_ROOT: ${{ secrets.LANDSHOP_DASHBOARD_APPROOT || vars.LANDSHOP_DASHBOARD_APPROOT || '/home/maleghif/landshop-app' }}
        run: |
          set -euo pipefail
          for key in SSH_HOST SSH_USER SSH_KEY KNOWN_HOSTS;do [ -n "${!key:-}" ] || exit 1;done
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" bash -s -- \
            "$WEBSITE_ROOT" "$PORTAL_ROOT" "$DASHBOARD_ROOT" "$GITHUB_RUN_ID" <<'REMOTE'
          set -eu
          umask 077
          website="$1";portal="$2";dashboard="$3";run="$4"
          case "$run" in ''|*[!0-9]*)exit 1;;esac
          for root in "$website" "$portal" "$dashboard";do
            case "$root" in "$HOME"/*) ;; *)echo "App root outside account";exit 1;;esac
            test -s "$root/server.js" && test -s "$root/LANDSHOP_RELEASE_SHA" || exit 1
          done
          snapshot="$HOME/landshop-deployment-backups/rollback-$run"
          test ! -e "$snapshot" || { echo "Rollback snapshot already exists";exit 1; }
          mkdir -p "$snapshot"
          chmod 700 "$snapshot"
          available=$(df -Pk "$HOME" | awk 'NR==2{print $4}')
          total=0
          for root in "$website" "$portal" "$dashboard";do
            kb=$(du -sk "$root" | awk '{print $1}')
            total=$((total+kb))
          done
          # Require 4x raw footprint free, allowing compression temp and other account operations.
          test "$available" -gt "$((total*4))" || { echo "Insufficient free disk space";rmdir "$snapshot";exit 1; }
          for name in website portal dashboard;do
            case "$name" in website)root="$website";;portal)root="$portal";;dashboard)root="$dashboard";;esac
            tar -czf "$snapshot/$name.tar.gz" -C "$root" --exclude='./tmp' .
            test -s "$snapshot/$name.tar.gz"
            tar -tzf "$snapshot/$name.tar.gz" >/dev/null
            cp "$root/LANDSHOP_RELEASE_SHA" "$snapshot/$name.release.txt"
            echo "Backup integrity verified: $name"
          done
          mkdir -p "$snapshot/main-site-document-root"
          for fname in .htaccess index.html;do
            if [ -f "$HOME/public_html/$fname" ];then
              cp -p "$HOME/public_html/$fname" "$snapshot/main-site-document-root/$fname"
            fi
          done
          (cd "$snapshot" && sha256sum website.tar.gz portal.tar.gz dashboard.tar.gz > SHA256SUMS)
          (cd "$snapshot" && sha256sum -c SHA256SUMS >/dev/null)
          printf '%s\n' "Previous-release snapshot verified on Namecheap"
          echo "Snapshot ID: rollback-$run"
          echo "Snapshot remains under private hosting home directory (0700); contents not exposed to the action logs."
          REMOTE
