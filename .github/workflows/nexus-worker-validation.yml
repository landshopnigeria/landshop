name: Validate NEXUS Preview Worker
on:
  pull_request:
    paths:
      - 'services/nexus-worker/**'
      - '.github/workflows/nexus-worker-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'services/nexus-worker/**'
      - '.github/workflows/nexus-worker-validation.yml'
permissions:
  contents: read
jobs:
  worker-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check services/nexus-worker/worker.mjs
      - name: Safe-preview unit tests (no live credentials)
        run: node --test services/nexus-worker/worker.test.mjs
